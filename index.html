<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMC Stakeholder Messages</title>
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --well: #f5f5f7;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --ink-3: #86868b;
  --line: #e5e5ea;
  --line-2: #d2d2d7;
  --btn: #e8e8ed;
  --btn-hover: #dcdce1;
  --blue: #0071e3;
  --blue-hover: #0077ed;
  --blue-ink: #0066cc;
  --blue-bg: #e8f2fd;
  --green: #1f8a3b;
  --green-dot: #34c759;
  --amber: #a85200;
  --amber-dot: #ff9500;
  --amber-bg: #fff6e8;
  --red: #d70015;
  --red-dot: #ff3b30;
  --red-bg: #ffeef0;
  --hl: #fff2bf;
  --scrim: rgba(0,0,0,.28);
  /* light hue per stakeholder group, recipients table only */
  --tint-atco: #eaf2fd;
  --tint-eng: #efecfb;
  --tint-mgmt: #e7f5f1;
  /* one colour per message subsection, shared by record and message */
  --s-affected: #ff3b30;
  --s-works: #34c759;
  --s-degraded: #ff9500;
  --s-expect: #0071e3;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.05);
  --shadow-lift: 0 12px 40px rgba(0,0,0,.14);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.47 var(--sans); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 20px; }
@media (max-width: 960px) { .wrap { padding: 0 16px; } }

/* ---------- sign-in ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; }
.login-inner { width: min(1040px, 100%); text-align: center; animation: rise .35s ease; }
.login .kicker { font: 13px var(--mono); color: var(--ink-2); letter-spacing: 0; }
.login h1 { font: 600 clamp(34px, 6vw, 56px)/1.05 var(--display); letter-spacing: -.03em; margin-top: 10px; }
.login .lede { font-size: 17px; color: var(--ink-2); margin-top: 12px; }
/* Wrapping, centred row: an incomplete last row stays centred. */
.profiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 36px; }
.profiles .profile { flex: 0 1 calc((100% - 48px) / 4); min-width: 200px; }
@media (max-width: 480px) { .profiles .profile { flex-basis: 100%; } }
.profile { border: 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 20px 22px; cursor: pointer; display: grid; justify-items: center; gap: 4px; transition: transform .2s, box-shadow .2s; }
.profile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.profile .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--well); display: grid; place-items: center; font: 600 19px var(--display); color: var(--ink-2); margin-bottom: 10px; }
.profile .pname { font: 600 19px var(--display); letter-spacing: -.015em; }
.profile .prole { font-size: 13px; color: var(--ink-2); }
.profile .pmsg { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.profile .plang { margin-top: 12px; font-size: 13px; font-weight: 500; color: var(--blue-ink); background: var(--blue-bg); border-radius: 980px; padding: 4px 12px; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 20; background: rgba(245,245,247,.82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,.06); }
.nav .wrap { display: flex; align-items: center; gap: 14px; min-height: 52px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.nav .name { font: 600 15px var(--display); margin-right: auto; }
/* Show sources: a switch, blue when on (blue = action, green is reserved for approved). */
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.toggle input { appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
.toggle input:checked { background: var(--blue); }
.toggle input:checked::after { transform: translateX(12px); }
.toggle input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .toggle input, .toggle input::after { transition: none; } }
/* Source chip after a message point: the record item it cites. Hover or focus
   highlights the item in the record; click scrolls to it. */
.src { font: 500 10px var(--mono); color: var(--ink-3); background: var(--card); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 4px; margin-left: 4px; cursor: pointer; vertical-align: 2px; }
.src:hover, .src:focus-visible { background: var(--hl); color: var(--ink); }
.src.none { cursor: default; font-family: var(--sans); }
.ritem.hl { background: var(--hl); }
.nav select { border: 0; background: transparent; font-size: 13px; color: var(--ink-2); cursor: pointer; max-width: 46vw; }
.me { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--card); border-radius: 980px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.me:hover { background: var(--well); }
.me .lang { font: 600 11px var(--mono); letter-spacing: 0; background: var(--btn); color: var(--ink-2); border-radius: 980px; padding: 3px 8px; }

/* ---------- hero ---------- */
.hero { padding: 36px 0 22px; }
.hero .kicker { font-size: 13px; color: var(--ink-2); font-family: var(--mono); letter-spacing: 0; }
.hero h1 { font: 600 clamp(28px, 4vw, 40px)/1.1 var(--display); letter-spacing: -.025em; margin-top: 8px; max-width: 28ch; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.sev { font: 600 12px/1 var(--sans); letter-spacing: .02em; padding: 6px 10px; border-radius: 980px; }
.sev.major { background: var(--red-bg); color: var(--red); }
.sev.minor { background: var(--btn); color: var(--ink-2); }
.setup, .modeline { margin-top: 14px; font-size: 13px; color: var(--ink-2); max-width: 80ch; }
.banner { margin-top: 18px; display: inline-flex; gap: 8px; align-items: center; padding: 9px 14px; border-radius: 12px; background: var(--amber-bg); color: var(--amber); font-size: 14px; animation: rise .35s ease; }
.banner.info { background: var(--blue-bg); color: var(--blue-ink); }

/* ---------- recipients ---------- */
.recips { margin-bottom: 20px; }
.recips-wrap { position: relative; }
/* The gear sits on the card's header row, outside <summary> so clicking it never toggles the table. */
.gear { position: absolute; top: 9px; right: 48px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; transition: background-color .2s, color .2s, transform .3s; }
.gear:hover { background: var(--well); color: var(--ink); transform: rotate(30deg); }
.gear svg { width: 19px; height: 19px; }

/* ---------- manage stakeholders ---------- */
.manage { padding-top: 22px; padding-bottom: 48px; max-width: 1100px; }
.manage .back { margin-left: -10px; }
.manage h1 { font: 600 clamp(28px, 4vw, 38px)/1.1 var(--display); letter-spacing: -.025em; margin: 10px 0 20px; }
.manage-add { padding: 18px 20px; margin-bottom: 16px; }
.manage-add label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 8px; }
.combo { position: relative; }
.combo input { width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 14px; font-size: 16px; background: var(--card); }
.combo input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-bg); }
.suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 15; background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lift), 0 0 0 1px var(--line); padding: 6px; max-height: 360px; overflow: auto; }
.suggest li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--blue-bg); }
.suggest .sn { font-weight: 600; }
.suggest .sg { font-size: 12px; color: var(--ink-2); text-align: right; }
.suggest .sd { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
.suggest .empty { cursor: default; color: var(--ink-2); font-size: 14px; }
.suggest .empty:hover { background: transparent; }
.manage-list { padding-top: 10px; }
.rtable td.act { width: 1%; white-space: nowrap; text-align: right; }
.rtable .none td { color: var(--ink-3); font-size: 13px; }
.recips > summary { display: flex; align-items: center; gap: 10px; padding: 14px 20px; cursor: pointer; list-style: none; font-size: 15px; font-weight: 600; }
.recips > summary::-webkit-details-marker { display: none; }
.recips > summary .count { font-weight: 400; color: var(--ink-2); font-size: 14px; }
.recips > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(45deg) translateY(-2px); transition: transform .2s; }
.recips[open] > summary::after { transform: rotate(225deg) translateY(-2px); }
.rtable-wrap { overflow-x: auto; padding: 0 12px 14px; }
.rtable { border-collapse: collapse; width: 100%; font-size: 14px; }
.rtable th, .rtable td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.rtable thead th { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.rtable .gr th, .rtable .gr td { background: var(--g-tint, var(--well)); border-bottom: 0; }
.rtable .gr.g-atco { --g-tint: var(--tint-atco); }
.rtable .gr.g-eng { --g-tint: var(--tint-eng); }
.rtable .gr.g-mgmt { --g-tint: var(--tint-mgmt); }
.rtable .gr td:first-child { border-radius: 10px 0 0 10px; }
.rtable .gr th { border-radius: 0 10px 10px 0; font-weight: 600; }
.rtable .gr .gmeta { font-weight: 400; color: var(--ink-2); margin-left: 8px; font-size: 13px; }
.rtable td.tick { width: 44px; }
.rtable input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: var(--blue); cursor: pointer; }
.rtable input:disabled { cursor: not-allowed; }
.rtable .role { color: var(--ink-2); font-size: 13px; }
.rtable thead th.role { font-size: 12px; color: var(--ink-3); }
.rtable tr.off td:not(.tick) { color: var(--ink-3); }
.rtable tr.off td.nm { text-decoration: line-through; }
.rtable tr.off td.nm .rsub { text-decoration: none; }
.rtable tr.na td { color: var(--ink-3); }
.rtable .rsub { display: none; }
@media (max-width: 600px) {
  .rtable th, .rtable td { padding: 8px 6px; }
  .rtable .role { display: none; }
  .rtable .rsub { display: block; font-size: 12px; color: var(--ink-2); }
}

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(360px, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; padding-bottom: 28px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- record ---------- */
.record { position: sticky; top: 68px; padding: 20px 22px 18px; max-height: calc(100vh - 84px); overflow: auto; }
@media (max-width: 960px) { .record { position: static; max-height: none; } }
.record-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.record-head h2 { font: 600 17px var(--display); }
.lock { font-size: 12px; color: var(--ink-3); }
.rev { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.rsec { margin-top: 16px; }
.rsec h3, .msec h3 { display: flex; align-items: center; gap: 8px; font: 600 13px var(--sans); }
.rsec h3::before, .msec h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
.affected { --dot: var(--s-affected); } .works { --dot: var(--s-works); } .degraded { --dot: var(--s-degraded); } .expect { --dot: var(--s-expect); }
.ritem { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 6px 4px 6px 16px; border-bottom: 1px solid var(--line); border-radius: 6px; }
.ritem:last-child { border-bottom: 0; }
.ritem p { font-size: 14px; line-height: 1.4; }
.ritem .meta { font-size: 11px; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0; white-space: nowrap; flex: none; }
.ritem.empty { color: var(--ink-3); font-size: 13px; }
.ritem.changed > p:first-child::after { content: "Updated"; margin-left: 6px; font: 600 10px var(--sans); color: var(--amber); background: var(--amber-bg); padding: 2px 6px; border-radius: 980px; vertical-align: 1px; }
.next { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.next p { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.next b { color: var(--ink); font-weight: 600; }

/* ---------- buttons ---------- */
.btn { border: 0; border-radius: 980px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; background: var(--btn); color: var(--ink); transition: background-color .2s, opacity .2s, transform .1s; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { cursor: not-allowed; opacity: .45; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.blue:hover:not(:disabled) { background: var(--blue-hover); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.dark:hover:not(:disabled) { background: #333336; }
.btn.ghost { background: transparent; color: var(--blue-ink); padding: 8px 10px; }
.btn.ghost:hover:not(:disabled) { background: var(--blue-bg); }
.approve { position: relative; overflow: hidden; --p: 0; min-width: 116px; }
.approve::before { content: ""; position: absolute; inset: 0; background: rgba(0,113,227,.22); transform-origin: left; transform: scaleX(var(--p)); transition: transform .25s linear; }
.approve:not(:disabled)::before { display: none; }
.approve:disabled { opacity: 1; background: var(--blue-bg); color: var(--blue-ink); }
.approve span { position: relative; }

/* ---------- audience card ---------- */
.groups { display: grid; gap: 20px; }
.group { padding: 24px; }
.ghead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.gtitle { position: relative; }
.gname { display: flex; align-items: center; gap: 8px; }
.gname h2 { font: 600 22px/1.2 var(--display); letter-spacing: -.02em; }
.ghead .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.sendbox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.sendbox .why { font-size: 13px; color: var(--ink-2); }
.sendbox .why.done { color: var(--green); }

/* the "i" accuracy button and its popover */
.kpi { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; padding: 0; cursor: pointer; font: italic 600 12px/1 Georgia, "Times New Roman", serif; transition: background-color .2s, color .2s, border-color .2s; }
.kpi:hover, .kpi[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.kpi.attn { border-color: var(--amber-dot); color: var(--amber); }
.kpi.attn:hover, .kpi.attn[aria-expanded="true"] { background: var(--amber-dot); color: #fff; }
.kpi-pop { position: absolute; top: calc(100% + 8px); left: 0; z-index: 15; width: min(320px, calc(100vw - 64px)); background: var(--card); border-radius: 14px; box-shadow: var(--shadow-lift), 0 0 0 1px var(--line); padding: 8px 14px; animation: rise .18s ease; }
.kpi-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kpi-row:last-child { border-bottom: 0; }
.kpi-row .k { font-size: 13px; font-weight: 500; }
.kpi-row .m { font-size: 11px; color: var(--ink-3); }
.kpi-row .v { font: 600 20px/1 var(--display); letter-spacing: -.02em; }
.kpi-row .v.warn { color: var(--amber); }
.kpi-row .v.muted { color: var(--ink-3); font-size: 14px; font-weight: 500; }

/* the message, as the stakeholder receives it */
.msg { margin-top: 16px; background: var(--well); border-radius: 16px; padding: 20px 22px; animation: rise .28s ease; }
.msg.approved { box-shadow: inset 0 0 0 2px var(--green-dot); }
.msg.editing { background: var(--card); box-shadow: inset 0 0 0 1.5px var(--blue); }
.msg .from { font-size: 12px; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0; }
.msg .title { font: 600 17px/1.3 var(--display); margin-top: 3px; }
.msec { margin-top: 14px; }
.msec-head { display: flex; align-items: center; gap: 8px; }
.msec li { position: relative; padding-left: 16px; margin-top: 4px; font-size: 15px; line-height: 1.45; }
.msec li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
/* Highlight the words only, at full letter height, also across line breaks. */
.msec li.flagged > .mark { background: var(--hl); border-radius: 4px; padding: 1px 3px; margin: 0 -3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.msec li.raw { color: var(--amber); font-style: italic; }
.live-note { flex-basis: 100%; font-size: 12px; color: var(--ink-3); }
.msec .rows { display: grid; gap: 6px; margin-top: 6px; }
.msec textarea { width: 100%; min-height: 40px; field-sizing: content; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; background: var(--card); font-size: 15px; line-height: 1.4; resize: vertical; }
.msec textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-bg); }
.add { width: 24px; height: 24px; border: 0; padding: 0; border-radius: 50%; background: transparent; color: var(--blue); cursor: pointer; display: inline-grid; place-items: center; transition: background-color .2s, transform .1s; }
.add:hover { background: var(--blue-bg); }
.add:active { transform: scale(.92); }
.add svg { width: 20px; height: 20px; }
.msg .placeholder { color: var(--ink-2); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.msg .placeholder::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: pulse 1s ease-in-out infinite; }

.flags { margin-top: 14px; display: grid; gap: 6px; }
.flag { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--amber-bg); color: var(--amber); font-size: 13px; line-height: 1.4; cursor: pointer; }
.flag input { margin: 2px 0 0; accent-color: var(--amber-dot); flex: none; }
/* Machine-translation note: the texts to compare, readable in body colour. */
.flag .mt-rows { display: grid; gap: 8px; margin-top: 8px; }
.flag .mt-row { display: grid; gap: 3px; }
.flag .mt-head { color: var(--amber); }
.flag .mt-line { display: flex; gap: 8px; color: var(--ink); font-size: 14px; }
.flag .mt-lang { font: 11px/1.9 var(--mono); color: var(--ink-2); flex: none; }
.flag.blocking { background: var(--red-bg); color: var(--red); cursor: default; font-weight: 500; }
.decide { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
.decide .why { font-size: 13px; color: var(--ink-2); margin-left: 6px; }
.decide .ok { color: var(--green); font-weight: 600; font-size: 14px; }
.decide .bad { color: var(--red); font-weight: 600; font-size: 14px; }
.note { font-size: 12px; color: var(--ink-3); margin-top: 10px; }

.also { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
.also > span { color: var(--ink-2); margin-right: 2px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--card); border-radius: 980px; padding: 5px 12px 5px 10px; font-size: 13px; cursor: pointer; transition: background-color .2s, border-color .2s; }
.pill:hover { background: var(--well); }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.dot.ok { background: var(--green-dot); } .dot.attn { background: var(--amber-dot); } .dot.bad { background: var(--red-dot); } .dot.live { background: var(--blue); }
.dot.busy { background: var(--ink-3); animation: pulse 1s ease-in-out infinite; }

.not-informed { padding: 20px 24px; color: var(--ink-2); font-size: 14px; }
.not-informed h2 { font: 600 17px var(--display); color: var(--ink); margin-bottom: 2px; }

/* ---------- review dialog (other languages) ---------- */
.dlg { border: 0; border-radius: 22px; padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 80px rgba(0,0,0,.25); color: var(--ink); background: var(--card); }
.dlg::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.dlg[open] { animation: rise .25s ease; }
.dlg-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); z-index: 1; }
.dlg-head h2 { font: 600 18px var(--display); letter-spacing: -.015em; }
#reviewbody { padding: 4px 22px 22px; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; width: min(560px, calc(100vw - 32px)); display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgba(29,29,31,.94); color: #fff; font-size: 14px; line-height: 1.4; box-shadow: var(--shadow-lift); animation: toast .3s ease; }
.toast.warn { background: var(--amber-bg); color: var(--amber); box-shadow: var(--shadow-lift), 0 0 0 1px var(--amber-dot); }
.toast p { flex: 1; }
.toast button { border: 0; background: transparent; color: inherit; opacity: .75; cursor: pointer; font-size: 13px; padding: 0 2px; }
.toast button:hover { opacity: 1; }

/* ---------- verification and activity log ---------- */
.log { margin: 8px 0 32px; }
.log > summary { cursor: pointer; font-size: 13px; color: var(--ink-2); list-style: none; padding: 12px 0; }
.log > summary::-webkit-details-marker { display: none; }
.log > summary::after { content: " ›"; }
.log[open] > summary::after { content: " ⌄"; }
.log .card { padding: 22px; }
.log h3 { font: 600 15px var(--display); margin: 4px 0 14px; }
.logbar { display: flex; gap: 12px; align-items: center; margin: 30px 0 8px; }
.logbar h3 { margin: 0; }
.tablewrap { overflow: auto; max-height: 440px; }
table.act thead th { position: sticky; top: 0; background: var(--card); }
table.act { border-collapse: collapse; width: 100%; font-size: 12px; }
table.act th, table.act td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.act th { font-weight: 600; color: var(--ink-2); }
td.mono { font-family: var(--mono); letter-spacing: 0; white-space: nowrap; }
details.sent { margin-top: 4px; }
details.sent summary { cursor: pointer; color: var(--blue-ink); }
details.sent pre { margin: 6px 0 2px; padding: 10px 12px; background: var(--well); border-radius: 10px; font: 12px/1.5 var(--sans); white-space: pre-wrap; max-width: 60ch; }

/* The flow: record -> English message per audience -> German and French.
   Wires are drawn in one SVG over the grid, from the real node positions. */
.flow { position: relative; display: grid; grid-template-columns: minmax(150px, 230px) minmax(240px, 1fr) minmax(150px, 230px); column-gap: clamp(56px, 9vw, 140px); row-gap: 18px; align-items: center; padding: 8px 0; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wire { fill: none; stroke: var(--line); stroke-width: 3; }
.current { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 11; animation: current .9s linear infinite; }
.current.live { stroke: var(--blue); }
.current.ok { stroke: var(--green-dot); }
.current.attn { stroke: var(--amber-dot); }
.current.bad { stroke: var(--red-dot); }
.current.pending { stroke: var(--line-2); stroke-dasharray: 4 6; animation: none; }
.fnode { position: relative; z-index: 1; display: grid; gap: 2px; text-align: left; border: 0; border-radius: 14px; background: var(--well); padding: 12px 14px; font-size: 12px; color: var(--ink-2); }
button.fnode { cursor: pointer; transition: box-shadow .2s, transform .1s; }
button.fnode:hover { box-shadow: 0 0 0 1.5px var(--line-2); }
button.fnode:active { transform: scale(.99); }
.fnode .fk { font: 600 14px var(--display); color: var(--ink); }
.fnode .fs { display: inline-flex; align-items: center; gap: 6px; }
.frec { grid-column: 1; grid-row: 1 / span var(--rows); align-self: center; background: var(--ink); color: rgba(255,255,255,.7); }
.frec .fk { color: #fff; }
.fen { grid-column: 2; grid-row: var(--row); background: var(--card); box-shadow: 0 0 0 1px var(--line-2), var(--shadow); padding: 14px 16px; }
.fen .fk { font-size: 16px; }
.ftr { grid-column: 3; grid-row: var(--row); display: grid; gap: 10px; }
.fnode.off { opacity: .5; }
.fnode.mine { box-shadow: 0 0 0 1.5px var(--blue); }
@media (max-width: 760px) {
  .flow { grid-template-columns: minmax(0, 1fr); row-gap: 26px; padding-left: 22px; }
  .frec, .fen, .ftr { grid-column: 1; grid-row: auto; }
  .ftr { grid-template-columns: 1fr 1fr; }
}

footer { padding: 0 0 40px; font-size: 12px; color: var(--ink-3); }

@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes current { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  const before = Object.fromEntries(audiencesFor().map((a) => [a, basisOf(a)]));
  S.changedItems = new Set();
  for (const it of u.set) {
    const copy = { ...it, aud: [...it.aud], tr: { ...it.tr } };
    const idx = S.rec.items.findIndex((x) => x.id === it.id);
    if (idx >= 0) S.rec.items[idx] = copy; else S.rec.items.push(copy);
    S.changedItems.add(it.id);
  }
  S.rec.items = S.rec.items.filter((x) => !u.remove.includes(x.id));

  S.rec.revision += 1;
  S.rec.updatedAt = u.updatedAt;
  log("System", "Incident record updated", { detail: `revision ${S.rec.revision}: ${u.label}` });

  const kept = audiencesFor().filter((a) => !changed.includes(a));

    (changed.length ? `Redrafted for ${changed.map((a) => AUD[a].label).join(", ")}; review again.` : "No message content changed.") +

  for (const s of SECTIONS) {
    const ps = ptsIn(aud, s);

/* mt: languages this point was machine-translated into by the local model,
   with no reference translation to verify it; the SMC checks those. */
const point = (id, section, src, lang, text) => ({ id, section, src, lang0: lang, text: { [lang]: text }, raw: {}, mt: {}, seen: seenOf(src), edited: false });

function ruleDraft(aud) {
  return itemsFor(aud).map((it) => point(it.id, it.section, [it.id], "en", it.text));
}

/* If only numbers, times or codes changed in the edited language, make the
   same swap in the other language. Any other wording change needs a real
   translation, so this returns null and the caller marks the point. */
function swapTokens(oldFrom, newFrom, oldTo) {
  const mask = (s) => s.replace(TOKEN_RE, "\u0000");
  if (mask(oldFrom) !== mask(newFrom)) return null;
  const a = oldFrom.match(TOKEN_RE) || [], b = newFrom.match(TOKEN_RE) || [];
  const map = new Map(), same = new Set();
  a.forEach((t, i) => { if (t === b[i]) same.add(t); else if (map.has(t) && map.get(t) !== b[i]) map.set(t, null); else map.set(t, b[i]); });
  const present = factTokens(oldTo);
  for (const [t, v] of map) if (v == null || same.has(t) || !present.has(t)) return null;
  return oldTo.replace(TOKEN_RE, (t) => map.has(t) ? map.get(t) : t);
}

/* Translation without AI, in order of trust: the bundled reference wording
   of the record item, a number/code swap on the previous translation, or a
   visible placeholder. New wording needs a real LLM (implementation phase). */
const PLACEHOLDER = {
  en: "Real LLM required → implementation phase",
  de: "Echtes LLM erforderlich → Umsetzungsphase",
  fr: "LLM réel requis → phase de mise en œuvre"
};
function demoTranslatePoint(p, from, to, before) {
  const src = p.text[from];
  if (p.src.length === 1) {
    const it = itemById(p.src[0]);
    if (it && refText(it, from) === src && refText(it, to)) return { text: refText(it, to), how: "reference" };
  }
  if (before && before.text[from] != null && before.text[to] && !before.raw[to]) {
    const swapped = swapTokens(before.text[from], src, before.text[to]);
    if (swapped != null) return { text: swapped, how: "swap" };
  }
  return { text: PLACEHOLDER[to], how: "raw" };
}

function withTimeout(promise, ms) {
  let t;
  const timeout = new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error("timeout"), { timeout: true, timeoutS: Math.round(ms / 1000) })), ms); });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
}

function aiErrorText(e) {
  if (e && e.timeout) return `no answer within ${e.timeoutS || 45} s` + (S.ai.provider === "local" ? "; try a smaller model" : "; the request may still finish in the background");
  if (window.tile && tile.TileSvcError && e instanceof tile.TileSvcError) {
    if (e.status === 404) return "AI is not enabled for this tile";
    if (e.status === 429) return "the daily AI budget is used up";
    if (e.status === 413) return "the request is too large";
    if (e.status === 401) return "your session expired; reload the page";
    if (e.status === 503) return "AI is temporarily unavailable";
    return `AI error ${e.status}: ${e.error || "request refused"}`;
  }
  return (e && e.message) || "unknown error";
}

function tokensOf(u) {
  if (!u || typeof u !== "object") return 0;
  if (typeof u.totalTokens === "number") return u.totalTokens;
  if (typeof u.total_tokens === "number") return u.total_tokens;
  const pick = (...ks) => ks.map((k) => u[k]).find((v) => typeof v === "number") || 0;
  return pick("inputTokens", "input_tokens", "input", "prompt_tokens") + pick("outputTokens", "output_tokens", "output", "completion_tokens");
}
function meter(r) {
  S.ai.calls += 1;
  S.ai.tokens += tokensOf(r && r.usage);
  if (r && r.cost && typeof r.cost.total === "number") { S.ai.cost += r.cost.total; S.ai.costKnown = true; }
  renderSvc();
}

/* Live progress of AI calls while the SMC waits. Keys: "draft:<aud>",
   "tr:<aud>:<lang>", "review:<aud>". The local model streams, so the count of
   finished points is read from its answer as it grows; Tile AI does not
   stream structured answers, so there only the elapsed time is shown. */
const PROG = new Map();
/* base: points already finished by earlier requests of the same job. */
function progressBegin(pk, total, unit, base = 0) {
  const local = S.ai.provider === "local";
  PROG.set(pk, { phase: local ? "queued" : "running", ahead: 0, text: "", tokens: 0, total: local ? total : 0, unit, base, t0: Date.now() });
}
function progressQueue(waiting) {
  /* One call is running; each waiting call has its place in the queue ahead of it. */
  waiting.forEach((pk, i) => { const p = PROG.get(pk); if (p) p.ahead = i + 1; });
}
function progressStart(pk) { const p = PROG.get(pk); if (p) { p.phase = "running"; p.t0 = Date.now(); } }
function progressChunk(pk, text, tokens) { const p = pk && PROG.get(pk); if (p) { p.text = text; p.tokens = tokens; } }
/* Finished JSON string values in a partial answer: one per point (keys, which
   are followed by a colon, do not count). */
function countJsonValues(t) {
  let n = 0, inStr = false, esc = false, closed = false;
  for (const c of t) {
    if (inStr) { if (esc) esc = false; else if (c === "\\") esc = true; else if (c === '"') { inStr = false; closed = true; } continue; }
    if (c === '"') { inStr = true; continue; }
    if (closed && !/\s/.test(c)) { if (c !== ":") n++; closed = false; }
  }
  return n;
}
function progressSuffix(pk) {
  const p = PROG.get(pk);
  if (!p) return "";
  if (p.phase === "queued") return ` · in the queue, ${plural(p.ahead, "request", "requests")} ahead`;
  const parts = [];
  /* Before the first token the model reads the whole prompt, which takes a while on a CPU. */
  if (!p.tokens && S.ai.provider === "local") return ` · reading the input · ${Math.max(0, Math.round((Date.now() - p.t0) / 1000))} s`;
  if (p.total) parts.push(`${Math.min(p.base + countJsonValues(p.text), p.total)} of ${p.total} ${p.unit}`);
  if (p.tokens) parts.push(`${p.tokens} tokens`);
  parts.push(`${Math.max(0, Math.round((Date.now() - p.t0) / 1000))} s`);
  return " · " + parts.join(" · ");
}
/* Repaint only the progress texts, not the whole page. */
setInterval(() => {
  if (!PROG.size) return;
  document.querySelectorAll("[data-progress]").forEach((el) => { el.textContent = el.dataset.base + progressSuffix(el.dataset.progress); });
  for (const pk of PROG.keys()) if (pk.startsWith("review:")) { const aud = pk.slice(7); LANGS.forEach((l) => updateGate(aud, l)); }
}, 500);

async function aiObject(prompt, schema, prog, local) {
  const args = { prompt, schema };
  if (S.ai.model && S.ai.provider === "tile") args.model = S.ai.model;
  if (local && S.ai.provider === "local") Object.assign(args, local); // { temperature, maxTokens }: local model only
  if (prog) progressBegin(prog.key, prog.total, prog.unit, prog.base || 0);
  let r;
  try { r = await aiCall("object", args, prog && prog.key); }
  finally { if (prog) PROG.delete(prog.key); }
  meter(r);
  if (!r || typeof r.object !== "object" || !r.object) throw new Error("the AI returned no structured answer");
  return r.object;
}

const arr = (item) => ({ type: "array", items: item });
const obj = (props) => ({ type: "object", properties: props, required: Object.keys(props), additionalProperties: false });
const LANG_TARGET = { en: "British English", de: "Swiss Standard German (write ss, never ß)", fr: "French as used in Switzerland" };

async function aiDraft(aud) {
  const items = itemsFor(aud);
  /* One required field per record item ID: schema-constrained models (Tile AI,
     Ollama) cannot skip or merge an item, and each point's source is known by
     construction instead of trusting the model to cite it. Points keep the
     item ID, as in ruleDraft, so record updates match them the same way. */
  const schema = obj(Object.fromEntries(items.map((i) => [i.id, { type: "string" }])));
  const prompt = [
    "You draft one short stakeholder message for an air traffic control incident at a Swiss air navigation service provider.",
    `Audience: ${AUD[aud].label}. ${AUD[aud].brief}`,
    "Rules:",
    "- For each record item ID, write one short, plain English point that states that item for this audience.",
    "- Use only the facts of that item. Do not add, infer, soften or speculate.",
    "- Keep every number, time, sector, node and system name exactly as written.",
    "",
    `Incident ${S.rec.id}, severity ${S.rec.severity}, record revision ${S.rec.revision}: ${S.rec.title}`,
    "Items (ID | section | text):",
    ...items.map((i) => `${i.id} | ${i.section} | ${i.text}`)
  ].join("\n");
  const o = await aiObject(prompt, schema, { key: "draft:" + aud, total: items.length, unit: "points" });
  return items.map((it) => {
    const text = typeof o[it.id] === "string" ? o[it.id].trim() : "";
    if (!text) throw new Error(`the AI draft has no text for item ${it.id}`);
    return point(it.id, it.section, [it.id], "en", text);
  });
}

const TRANSLATE_RULES = [
  "- Keep all numbers, times, UTC, sector names, node names and upper-case system names exactly as written.",
  "- Write every number as digits, exactly as in the source (3, never drei or trois).",
  "- Do not add, drop or soften any information. Keep it as short as the source."
];

/* One point per request for the local model: the answer is a single text, so
   a point with several sentences cannot come back split into several points,
   and one failed point does not take the others with it. */
async function aiTranslateOne(text, from, to, prog) {
  const prompt = [
    `Translate this point of an air traffic control stakeholder message from ${LANG_NAME[from]} into ${LANG_TARGET[to]}.`,
    "It may have several sentences: translate all of them, as one text.",
    "Rules:",
    ...TRANSLATE_RULES,
    "",
    "Point:",
    text
  ].join("\n");
  /* About 3 characters per token; a translation is rarely much longer than its source. */
  const maxTokens = 60 + Math.ceil(text.length * 2 / 3);
  let why = "";
  /* At temperature 0 a small model that loops repeats the same loop every time,
     so the one retry samples a little. This is not a retry of a refused request. */
  for (const temperature of [0, 0.5]) {
    try {
      const o = await aiObject(prompt, obj({ translation: { type: "string" } }), prog, { temperature, maxTokens });
      const t = typeof o.translation === "string" ? o.translation.trim() : "";
      why = translationProblem(text, t, to);
      if (!why) return t;
    } catch (e) {
      if (e.timeout || /not reachable/.test(e.message || "")) throw e;
      why = aiErrorText(e);
    }
  }
  throw new Error(why);
}

/* Cheap checks that catch the ways a small model fails at translating: no
   answer, the source copied back instead of translated, or added commentary. */
function translationProblem(src, out, to) {
  if (!out) return `the ${LANG_NAME[to]} translation is empty`;
  const norm = (x) => x.toLowerCase().replace(/\s+/g, " ").trim();
  if (src.length > 25 && norm(out).includes(norm(src))) return `the ${LANG_NAME[to]} translation repeats the source instead of translating it`;
  if (out.length > src.length * 2 + 40) return `the ${LANG_NAME[to]} translation adds text that is not in the source`;
  return "";
}

/* Returns one text per input; locally a failed point is null (the caller
   shows the placeholder for it) and the reasons are in .failed. */
async function aiTranslateTexts(texts, from, to, pk) {
  if (S.ai.provider === "local") {
    const out = [], failed = [];
    for (let i = 0; i < texts.length; i++) {
      try { out.push(await aiTranslateOne(texts[i], from, to, pk && { key: pk, total: texts.length, unit: "points", base: i })); }
      catch (e) {
        if (e.timeout || /not reachable/.test(e.message || "")) throw e; // the model is gone: the rest would fail too
        out.push(null); failed.push(aiErrorText(e));
      }
    }
    if (out.every((x) => x == null)) throw new Error(failed[0] || `the ${LANG_NAME[to]} translation failed`);
    out.failed = failed;
    return out;
  }
  const prompt = [
    `Translate each point of this air traffic control stakeholder message from ${LANG_NAME[from]} into ${LANG_TARGET[to]}.`,
    "Rules:",
    "- Return exactly one translation per point, in the same order.",
    ...TRANSLATE_RULES,
    "",
    "Points (JSON array):",
    JSON.stringify(texts)
  ].join("\n");
  const o = await aiObject(prompt, obj({ points: arr({ type: "string" }) }), pk && { key: pk, total: texts.length, unit: "points" });
  if (!Array.isArray(o.points) || o.points.length !== texts.length) throw new Error(`the ${LANG_NAME[to]} translation changed the number of points`);
  const out = o.points.map((x) => typeof x === "string" ? x.trim() : "");
  if (out.some((x) => !x)) throw new Error(`the ${LANG_NAME[to]} translation has empty points`);
  /* A lost number or code is not repaired here: the rule check names the
     point for the SMC. (A second "fix it" call made small models copy the
     hint into the text and garble the wording, which is worse.) */
  return out;
}

/* The review judges each point only against its own reference: English
   against the record item(s) it cites, German and French against the English
   point. The record is the single source of truth, so the reviewer has no way
   to ask for facts the record does not hold. Whether every record item is
   covered is the rule checks' job, not the reviewer's. The score is the share
   of points the reviewer confirmed, so it always matches the listed issues.
   Returns the same shape as before: { [lang]: { score, issues } }. */
async function aiReview(aud, langs) {
  const rows = [];
  for (const s of SECTIONS) ptsIn(aud, s).forEach((p, index) => rows.push({ p, s, index, k: "p" + (rows.length + 1) }));
  const refOf = (r, l) => {
    if (l !== "en") return r.p.text.en || "";
    const items = r.p.src.map(itemById).filter(Boolean);
    return items.length ? items.map((i) => i.text).join(" ") : null; // SMC-added point: no record item to compare with
  };
  const plan = Object.fromEntries(langs.map((l) => [l, rows.filter((r) => refOf(r, l) && (r.p.text[l] || "").trim())]));
  const verdict = obj({ ok: { type: "boolean" }, problem: { type: "string" } });
  const schema = obj(Object.fromEntries(langs.map((l) => [l, obj(Object.fromEntries(plan[l].map((r) => [r.k, verdict])))])));
  const prompt = [
    "You check stakeholder messages for an air traffic control incident, one point at a time.",
    "Compare each point only with its own reference text:",
    "- \"en\" points: the reference is the incident record item. The record is the single source of truth.",
    "- \"de\" and \"fr\" points: the reference is the English point it was translated from.",
    "Set ok to true when the point states the same facts as its reference.",
    "Set ok to false only when the point changes, adds or drops a fact, number, time, name or code of its reference, or the translation changes the meaning.",
    "Never ask for information that is not in the reference. Rewording, word order, and local spellings of place names (Geneva, Genf, Genève) are fine.",
    "If a point and its reference say the same thing, ok is true.",
    "problem: when ok is false, one short English sentence naming what differs (for example: \"says 4 minutes, the reference says 3\"). Do not just repeat the two texts. When ok is true, an empty string.",
    "",
    ...langs.flatMap((l) => [`${l} points (key | reference | point):`, ...plan[l].map((r) => `${r.k} | ${refOf(r, l)} | ${r.p.text[l]}`), ""])
  ].join("\n");
  const o = await aiObject(prompt, schema, { key: "review:" + aud, total: langs.reduce((n, l) => n + plan[l].length, 0), unit: "points checked" });
  /* A problem that only quotes the point and its reference ("X vs. X") names
     no difference. Small models do this; it is not actionable for the SMC. */
  const norm = (x) => String(x || "").toLowerCase().replace(/[\s.,:;!?'"«»„“”‘’()\-–]+/g, " ").trim();
  const namesDifference = (problem, r, l) => {
    let rest = norm(problem);
    for (const t of [norm(r.p.text[l]), norm(refOf(r, l))]) if (t) rest = rest.split(t).join(" ");
    return rest.replace(/\b(vs|versus|and|compared to|instead of|reference|point)\b/g, " ").replace(/\s+/g, "").length >= 3;
  };
  return Object.fromEntries(langs.map((l) => {
    const got = o[l] && typeof o[l] === "object" ? o[l] : null;
    if (!got || !plan[l].length) return [l, { score: got ? 100 : null, issues: [] }];
    const issues = [];
    let ok = 0;
    for (const r of plan[l]) {
      const v = got[r.k];
      const problem = v && typeof v.problem === "string" ? v.problem.trim() : "";
      /* A "not ok" without a stated difference is not actionable for the SMC, so it counts as confirmed. */
      const same = l === "en" && norm(r.p.text.en) === norm(refOf(r, l)); // verbatim from the record: nothing can differ
      if (v && v.ok === false && problem && !same && namesDifference(problem, r, l)) issues.push({ section: r.s, index: r.index, problem });
      else ok++;
    }
    return [l, { score: Math.round(100 * ok / plan[l].length), issues }];
  }));
}

async function generateAudience(aud) {
  const seq = ++GEN;
  const prev = S.aud[aud];
  if (prev) for (const l of LANGS) if (prev.msgs[l].status === "approved")
    log("System", "Approval withdrawn", { key: key(aud, l), detail: `record revision ${S.rec.revision} changed this audience's content` });
  /* src: the language the SMC last authored in (English until someone edits).
     pending: edited points whose translation has not landed yet. */
  const A = S.aud[aud] = { seq, tgen: 0, nextN: 0, points: [], src: "en", pending: new Map(), msgs: Object.fromEntries(LANGS.map((l) => [l, newMsg(aud, l, prev && prev.msgs[l])])) };
  if (S.edit && S.edit.aud === aud) S.edit = null;
  render();

  let pts = null, origin = "rule", note = "";
  if (aiDrafts()) {
    try { pts = await aiDraft(aud); origin = "ai"; }
    catch (e) { note = `AI draft failed (${aiErrorText(e)}). Showing the rule-based draft.`; log("System", "AI draft failed", { key: key(aud, "en"), detail: aiErrorText(e) }); }
  }
  if (!live(aud, seq)) return;
  A.points = pts || ruleDraft(aud);
  Object.assign(A.msgs.en, { status: "draft", origin, note, review: aiReviews() ? "pending" : "off" });
  refreshMsg(A.msgs.en);
  log(origin === "ai" ? "AI" : "System", "English draft created", { key: key(aud, "en"), detail: `${origin === "ai" ? aiName() : "rule-based"}, from record revision ${A.msgs.en.rev}` });
  render();

  await translatePoints(aud, "en", ["de", "fr"], A.points.map((p) => ({ p, before: null })), seq);
  if (live(aud, seq)) await reviewAudience(aud, seq);
}

/* A record update keeps the SMC's edits. Unedited points follow the record;
   edited and added points stay as written (a note flags any whose source
   changed). Approvals are withdrawn because the content changed. */
async function rebaseAudience(aud) {
  const A = S.aud[aud];
  if (!A || !A.points.some((p) => p.edited) || LANGS.some((l) => A.msgs[l].status === "generating")) { generateAudience(aud); return; }
  const items = itemsFor(aud), byId = new Map(items.map((i) => [i.id, i]));
  const unchanged = (p) => p.src.every((id) => byId.has(id) && byId.get(id).text === p.seen[id]);
  const next = [], fresh = [];
  const fromRecord = (it) => { const q = point(`${it.id}.r${S.rec.revision}`, it.section, [it.id], "en", it.text); next.push(q); fresh.push(q); };
  for (const p of A.points) {
    if (p.edited || !p.src.length || unchanged(p)) { next.push(p); continue; }
    /* Unedited point whose source changed or went away: take the new wording. */
    for (const id of p.src) if (byId.has(id) && !next.some((q) => q.src.includes(id))) fromRecord(byId.get(id));
  }
  for (const it of items) if (!next.some((q) => q.src.includes(it.id))) fromRecord(it);
  A.points = next;
  for (const l of LANGS) {
    resetDecision(A.msgs[l], `record revision ${S.rec.revision} changed this audience's content`);
    Object.assign(A.msgs[l], { rev: S.rec.revision, basis: basisOf(aud) });
  }
  log("System", "Message updated from record", { key: key(aud, "en"), detail: `revision ${S.rec.revision}: ${plural(fresh.length, "point", "points")} from the record, SMC edits kept` });
  if (fresh.length) await translatePoints(aud, "en", ["de", "fr"], fresh.map((p) => ({ p, before: null })), A.seq, true);
  else { refreshAll(aud); render(); }
  if (live(aud, A.seq)) reviewAudience(aud, A.seq);
}

/* Fill the target languages for the changed points, from `from`.
   Returns a summary for the pop-up, or null if superseded. */
async function translatePoints(aud, from, targets, changes, seq, keepOrigin = false) {
  const A = S.aud[aud], tg = ++A.tgen;
  /* Withdraw first, so the log shows which approvals the change cost. */
  targets.forEach((l) => { resetDecision(A.msgs[l], `the ${LANG_NAME[from]} text changed`); A.msgs[l].status = "generating"; });
  render();
  /* srcOf(i): the text the model translates for change i. Normally the edited
     language; see the English pivot below. */
  const translateTo = async (to, srcOf, srcLang) => {
    /* Locally, verified text comes first: the bundled reference wording or a
       number/code swap. Only points with neither go to the model. */
    const plan = changes.map((c) => referenceFirst() ? demoTranslatePoint(c.p, from, to, c.before) : null);
    const need = changes.map((_, i) => i).filter((i) => !plan[i] || plan[i].how === "raw");
    if (!aiReady() || !need.length) return { to, plan, need: [], texts: null, note: "" };
    try { return { to, plan, need, texts: await aiTranslateTexts(need.map(srcOf), srcLang, to, `tr:${aud}:${to}`), note: "" }; }
    catch (e) {
      log("System", "AI translation failed", { key: key(aud, to), detail: aiErrorText(e) });
      return { to, plan, need: [], texts: null, note: `AI translation failed (${aiErrorText(e)}).` };
    }
  };
  /* The text a result gives change i (AI, reference, swap or placeholder). */
  const pick = (r, i) => {
    const n = r.texts ? r.need.indexOf(i) : -1;
    if (n >= 0 && r.texts[n] != null) return { text: r.texts[n], how: "ai" };
    return r.plan[i] || demoTranslatePoint(changes[i].p, from, r.to, changes[i].before);
  };
  let results;
  if (referenceFirst() && from !== "en" && targets.includes("en") && targets.length > 1) {
    /* English pivot for the local model: measured, it translates between
       English and German or French well, but from German straight into French
       it copied the German back or wrote commentary. So an edit in DE or FR goes
       to English first, and the third language is translated from that English. */
    const en = await translateTo("en", (i) => changes[i].p.text[from], from);
    const enText = changes.map((_, i) => { const x = pick(en, i); return x.how === "raw" ? null : x.text; });
    const rest = await Promise.all(targets.filter((l) => l !== "en").map((to) =>
      translateTo(to, (i) => enText[i] ?? changes[i].p.text[from], enText.every((x) => x != null) ? "en" : from)));
    results = [en, ...rest];
  } else {
    results = await Promise.all(targets.map((to) => translateTo(to, (i) => changes[i].p.text[from], from)));
  }
  if (!live(aud, seq) || A.tgen !== tg) return null;
  const sum = { ai: 0, reference: 0, swap: 0, raw: new Set() };
  const initial = from === "en" && changes.every((c) => !c.before);
  for (const r of results) {
    changes.forEach((c, i) => {
      const { text, how } = pick(r, i);
      c.p.text[r.to] = text;
      c.p.raw[r.to] = how === "raw";
      (c.p.mt ||= {})[r.to] = how === "ai" && S.ai.provider === "local";
      if (how === "raw") sum.raw.add(c.p.id); else sum[how]++;
    });
    const m = A.msgs[r.to];
    const origin = keepOrigin ? m.origin : r.texts ? "ai" : initial ? "demo" : "carried";
    const failedPts = r.texts && r.texts.failed ? r.texts.failed : [];
    if (failedPts.length) {
      r.note = `AI translation failed for ${plural(failedPts.length, "point", "points")} (${failedPts[0]}).`;
      log("System", "AI translation failed", { key: key(aud, r.to), detail: `${plural(failedPts.length, "point", "points")}: ${failedPts[0]}` });
    }
    Object.assign(m, { status: "draft", origin, from, note: r.note, readMs: 0, acks: {}, aiScore: null, aiIssues: [], review: aiReviews() ? "pending" : "off" });
    const done = r.texts ? r.texts.filter((x) => x != null).length : 0;
    const viaAi = r.texts ? `${aiName()}, ${plural(done, "point", "points")}` + (r.to !== "en" && r.need.length && referenceFirst() && from !== "en" && targets.includes("en") ? " (via the English)" : "")
      + (r.need.length < changes.length ? "; the rest from reference wording" : "") : null;
    log(r.texts ? "AI" : "System", initial ? `${LANG_NAME[r.to]} translation created` : `${LANG_NAME[r.to]} updated from ${LANG_NAME[from]}`,
      { key: key(aud, r.to), detail: viaAi || (initial ? "reference translation" : "rule-based: reference wording or number swap") });
  }
  refreshAll(aud);
  render();
  return sum;
}

async function reviewAudience(aud, seq) {
  if (!aiReviews() || !live(aud, seq)) return;
  const A = S.aud[aud];
  const langs = LANGS.filter((l) => A.msgs[l].status === "draft" && A.points.some((p) => (p.text[l] || "").trim()));
  if (!langs.length) return;
  const texts = Object.fromEntries(langs.map((l) => [l, canonical(aud, l)]));
  langs.forEach((l) => { A.msgs[l].review = "pending"; });
  render();
  try {
    const r = await aiReview(aud, langs);
    if (!live(aud, seq)) return;
    for (const l of langs) {
      const m = A.msgs[l], x = r[l];
      if (canonical(aud, l) !== texts[l]) continue; // text changed while the review ran
      m.aiScore = x && typeof x.score === "number" ? Math.round(clamp(x.score, 0, 100)) : null;
      m.aiIssues = x && Array.isArray(x.issues) ? x.issues.filter((i) => i && typeof i.problem === "string" && SECTIONS.includes(i.section) && Number.isInteger(i.index)).slice(0, 6) : [];
      m.review = m.aiScore == null ? "failed" : "done";
      refreshMsg(m);
      log("AI", "Reviewed", { key: key(aud, l), detail: m.aiScore == null ? "no score returned" : `accuracy ${m.aiScore}%, ${plural(m.aiIssues.length, "issue", "issues")}` });
    }
  } catch (e) {
    if (!live(aud, seq)) return;
    for (const l of langs) { const m = A.msgs[l]; if (canonical(aud, l) === texts[l]) { m.review = "failed"; refreshMsg(m); } }
    log("System", "AI review failed", { detail: `${AUD[aud].label}: ${aiErrorText(e)}` });
  }
  render();
}

/* Save the SMC's edit, then bring the other two languages in line with it.
   An emptied point is removed from every language. */
async function saveEdit() {
  const E = S.edit;
  if (EDIT_MODE || !E) return;
  const A = S.aud[E.aud], L = E.lang;
  const old = new Map(A.points.map((p) => [p.id, p]));
  const next = [], changes = [];
  let added = 0;
  for (const s of SECTIONS) for (const row of E.secs[s]) {
    const t = row.text.replace(/\s+/g, " ").trim();
    if (!t) continue;
    if (row.pid && old.has(row.pid)) {
      const p = old.get(row.pid);
      if (p.text[L] !== t) {
        const before = { text: { ...p.text }, raw: { ...p.raw } };
        p.text[L] = t; p.raw[L] = false; p.lang0 = L; p.edited = true;
        changes.push({ p, before });
      }
      next.push(p);
    } else {
      const p = point("N" + (++A.nextN), s, [], L, t);
      p.edited = true;
      changes.push({ p, before: null }); next.push(p); added++;
    }
  }
  const removed = A.points.filter((p) => !next.includes(p)).length;
  S.edit = null;
  if (!changes.length && !removed) { render(); showToast("No changes to save.", "info"); return; }
  A.points = next;
  /* The SMC has just reviewed the whole message against the current record. */
  next.forEach((p) => { p.seen = seenOf(p.src); });
  A.src = L;
  const m = A.msgs[L];
  resetDecision(m, "edited by the SMC");
  Object.assign(m, { origin: "edited", from: L, note: "" });
  /* A newer edit supersedes a translation still running, so carry its points along. */
  for (const c of changes) if (!A.pending.has(c.p.id)) A.pending.set(c.p.id, c);
  const todo = [...A.pending.values()].filter((c) => A.points.includes(c.p));
  log("SMC", "Edited", { key: key(E.aud, L), detail: [`${plural(changes.length - added, "point", "points")} changed`, `${added} added`, `${removed} removed`].join(", ") });
  const others = LANGS.filter((l) => l !== L);
  if (aiReady() && changes.length) showToast(`Translating your edit into ${others.map((l) => LANG_NAME[l]).join(" and ")}…`, "info");
  const sum = await translatePoints(E.aud, L, others, todo, A.seq);
  if (!sum) return;
  A.pending.clear();
  const names = others.map((l) => LANG_NAME[l]).join(" and ");
  const raw = sum.raw.size;
  if (raw) showToast(`${names} messages updated. ${plural(raw, "point", "points")} with new wording ${raw === 1 ? "shows" : "show"} a placeholder in each language until a real LLM translates ${raw === 1 ? "it" : "them"} (implementation phase).`, "warn");
  else showToast(`${names} messages updated to match your edit.`, "info");
  reviewAudience(E.aud, A.seq);
}

   Managing stakeholders. Changes last for this session only: the
   organisation directory is fictional and nothing is stored.
   ===================================================================== */
const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const SUG = { q: "", items: [], taken: [], active: -1 };

function searchOrg(q) {
  const t = fold(q.trim());
  const inDir = new Set(DIRECTORY.map((p) => p.id));
  const hits = t ? ORG.filter((p) => fold(p.name).includes(t))
    .sort((a, b) => AUD_ORDER.indexOf(a.aud) - AUD_ORDER.indexOf(b.aud) || a.name.localeCompare(b.name)) : [];
  Object.assign(SUG, { q, items: hits.filter((p) => !inDir.has(p.id)).slice(0, 8), taken: hits.filter((p) => inDir.has(p.id)), active: -1 });
  renderSuggest();
}
function renderSuggest() {
  const input = $("orgsearch"), ul = $("orgsuggest");
  const open = !!SUG.q.trim();
  ul.hidden = !open;
  input.setAttribute("aria-expanded", String(open));
  input.removeAttribute("aria-activedescendant");
  if (!open) { ul.replaceChildren(); return; }
  if (!SUG.items.length) {
    ul.replaceChildren(h("li", { class: "empty", role: "option", "aria-disabled": "true" }, SUG.taken.length
      ? `Already a stakeholder: ${SUG.taken.map((p) => p.name).join(", ")}.`
      : `No one in the organisation matches "${SUG.q.trim()}".`));
    return;
  }
  ul.replaceChildren(...SUG.items.map((p, i) => h("li", { role: "option", id: "sg-" + p.id, "aria-selected": String(i === SUG.active),
      onmousedown: (e) => e.preventDefault(), onclick: () => addStakeholder(p) },
    h("span", { class: "sn" }, p.name),
    h("span", { class: "sg" }, AUD[p.aud].label),
    h("span", { class: "sd" }, `${LANG_NAME[p.lang]} · ${p.channel} · ${p.role}`))));
  if (SUG.active >= 0) {
    input.setAttribute("aria-activedescendant", "sg-" + SUG.items[SUG.active].id);
    $("sg-" + SUG.items[SUG.active].id)?.scrollIntoView({ block: "nearest" });
  }
}
function onSearchKey(e) {
  const n = SUG.items.length;
  if (e.key === "ArrowDown" && n) { e.preventDefault(); SUG.active = (SUG.active + 1) % n; renderSuggest(); }
  else if (e.key === "ArrowUp" && n) { e.preventDefault(); SUG.active = (SUG.active - 1 + n) % n; renderSuggest(); }
  else if (e.key === "Enter" && n) { e.preventDefault(); addStakeholder(SUG.items[Math.max(SUG.active, 0)]); }
  else if (e.key === "Escape") { e.preventDefault(); $("orgsearch").value = ""; searchOrg(""); }
}

function sendState(aud) {
  const total = LANGS.reduce((n, l) => n + recipients(aud, l).length, 0);
  if (!total) return { ok: false, why: "No recipients selected" };
  const L = S.user.lang, mine = msgOf(aud, L);
  if (LANGS.some((l) => !msgOf(aud, l) || msgOf(aud, l).status === "generating")) return { ok: false, why: "Drafting…" };
  if (LANGS.some((l) => msgOf(aud, l).basis !== basisOf(aud))) return { ok: false, why: "Record changed, redrafting" };
  if (S.edit && S.edit.aud === aud) return { ok: false, why: "Editing" };
  if (mine.status !== "approved") return { ok: false, why: `Approve the ${LANG_NAME[L]} message first` };
  const sentAll = LANGS.filter((l) => recipients(aud, l).length).every((l) => { const m = msgOf(aud, l); return m.sent && m.sent.text === canonical(aud, l); });
  if (sentAll) return { ok: false, why: `Simulated send ${mine.sent?.at || ""}`.trim(), sent: true };
  return { ok: true, why: `Ready for ${plural(total, "recipient", "recipients")}` };
}

/* The SMC approves their own language; the other two follow it and go out
   as they stand. Each sent text is kept in the activity log as proof. */
function simulateSend(aud) {
  if (EDIT_MODE || !sendState(aud).ok) return;
  const L = S.user.lang, mine = msgOf(aud, L);
  /* Compare the exact text again: nothing may differ from what the SMC approved. */
  if (canonical(aud, L) !== mine.approvedText) {
    log("System", "Simulated send blocked", { key: key(aud, L), detail: "text differs from what was approved" });
    S.bannerKind = "warn"; S.banner = `Simulated send blocked: the ${LANG_NAME[L]} message for ${AUD[aud].label} no longer matches what you approved. Review it again.`;
    resetDecision(mine, "text differs from what was approved");
    refreshMsg(mine);
    render(); return;
  }
  const at = nowUtc();
  for (const l of LANGS) {
    const people = recipients(aud, l), m = msgOf(aud, l), text = canonical(aud, l);
    m.sent = { at, text };
    if (people.length) log("SMC", "Simulated send", { key: key(aud, l), text,
      detail: `to ${people.map((p) => `${p.name} (${p.channel})`).join(", ")}` + (l === L ? "; matches your approval" : `; follows the approved ${LANG_NAME[L]} text`) });
  }
  S.bannerKind = "info";
  S.banner = `Simulated send to ${AUD[aud].label} at ${at}. Each sent text is in the activity log.`;
  render();
}

async function detectAi() {
  const off = "Tile AI off: English comes from the record, German and French from bundled reference translations. No AI review.";
  if (window.__tileLoadFailed || !window.tile || !tile.ai) return detectLocalAi(off);
  try {
    const a = await tile.ai.available();
    if (!a.ok) {
      const why = { "not-enabled": "not enabled for this tile", "not-a-viewer": "you have no AI access on this tile; ask a tile admin", unavailable: "temporarily unavailable" }[a.reason] || "not available";
      Object.assign(S.ai, { state: "off", reason: a.reason, message: `Tile AI ${why}. ${off.replace("Tile AI off: ", "")}` });
      return;
    }
    const chat = (a.models || []).filter((m) => m.kind === "chat");
    const eu = chat.find((m) => m.residency === "eu");
    const dflt = chat.find((m) => m.id === a.default);
    Object.assign(S.ai, { state: "ready", provider: "tile", model: eu ? eu.id : null, residency: (eu || dflt || {}).residency || null });
  } catch (e) {
    Object.assign(S.ai, { state: "off", message: `Tile AI check failed. ${off.replace("Tile AI off: ", "")}` });
  }
}

/* Outside Tile: use a local Ollama if one answers, otherwise keep the
   no-AI behaviour (record wording, reference translations, placeholders). */
async function detectLocalAi(off) {
  try {
    const a = await LocalAI.available();
    if (!a.model) { Object.assign(S.ai, { state: "off", reason: "local-no-model", message: off }); return; }
    Object.assign(S.ai, { state: "ready", provider: "local", model: a.model, residency: "local" });
  } catch (e) {
    Object.assign(S.ai, { state: "demo", message: off });
  }
}

function startScenario(i) {
  loadScenario(i);
  closeReview();
  S.toast = null; renderToast();
  render();
  if (!EDIT_MODE) audiencesFor().forEach((a) => generateAudience(a));
}

function signIn(u) {
  const switching = !!S.user;
  S.user = u;
  S.edit = null; S.kpi = null;
  S.toast = null; renderToast();
  closeReview();
  log("SMC", switching ? "Switched profile" : "Signed in", { detail: `${u.role}, messages in ${LANG_NAME[u.lang]}` });
  $("login").hidden = true;
  $("app").hidden = false;
  S.view = "messages"; $("manage").hidden = true; $("main").hidden = false;
  window.scrollTo(0, 0);
  if (!S.started) { S.started = true; startScenario(Number($("scenario").value) || 0); }
  else render();
}
function showLogin() {
  S.edit = null; S.kpi = null;
  closeReview();
  $("app").hidden = true;
  $("login").hidden = false;
  $("profiles").querySelector("button")?.focus();
}

let aiReadyPromise = null;
(async () => {
  $("profiles").replaceChildren(...USERS.map((u) => h("button", { class: "profile", type: "button", onclick: async () => { await aiReadyPromise; signIn(u); } },
    h("span", { class: "avatar", "aria-hidden": "true" }, u.initials),
    h("span", { class: "pname" }, u.name),
    h("span", { class: "prole" }, u.role),
    h("span", { class: "plang" }, u.flavour),
    h("span", { class: "pmsg" }, `Messages in ${LANG_SELF[u.lang]}`))));
  const sel = $("scenario");
  SCENARIOS.forEach((sc, i) => sel.append(h("option", { value: String(i) }, `${sc.record.system} · ${sc.record.severity}`)));
  sel.addEventListener("change", () => startScenario(Number(sel.value)));
  $("me").addEventListener("click", showLogin);
  $("sources").addEventListener("change", (e) => { S.showSources = e.target.checked; render(); });
  $("managebtn").append(gearIcon());
  $("managebtn").addEventListener("click", openManage);
  $("manageback").addEventListener("click", closeManage);
  $("orgsearch").addEventListener("input", (e) => searchOrg(e.target.value));
  $("orgsearch").addEventListener("keydown", onSearchKey);
  $("log").addEventListener("toggle", renderLog);
  $("reviewclose").addEventListener("click", closeReview);
  $("reviewdlg").addEventListener("close", () => { S.review = null; $("reviewbody").replaceChildren(); render(); });
  $("reviewdlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeReview(); });
  document.addEventListener("click", (e) => { if (S.kpi && !e.target.closest(".kpi-pop")) { S.kpi = null; renderCards(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.kpi) { const a = S.kpi; S.kpi = null; renderCards(); document.querySelector(`[data-fid="kpi:${a}"]`)?.focus(); } });
  aiReadyPromise = detectAi();
  await aiReadyPromise;
  log("System", "Session started", { detail: S.ai.state !== "ready" ? "AI off" : S.ai.provider === "local" ? aiName() : `Tile AI ${S.ai.model || "default model"}` });
  renderSvc();
})();
</script>
